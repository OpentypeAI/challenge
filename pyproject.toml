[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opentype-challenge"
version = "1.0.0"
description = "Cortex challenge container for TD-Exact: DiffusionGemma duels on exact-gold typed decisions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Ranges stay wide on purpose: the worker image installs this package into the
# pinned vLLM image and must not move any of vLLM's own packages.
dependencies = [
  "fastapi>=0.133",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "py-sr25519-bindings>=0.2.3,<0.3",
  "uvicorn>=0.34",
  "pillow>=11,<13",
]

[project.optional-dependencies]
worker = ["huggingface_hub>=1.0"]
miner = ["huggingface_hub>=1.0"]
wallet = ["bittensor-wallet>=4,<5"]

[project.urls]
Source = "https://github.com/OpentypeAI/challenge"

[project.scripts]
opentype-challenge = "opentype_challenge.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.16,<0.17", "mypy>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/opentype_challenge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sr25519", "bittensor_wallet"]
ignore_missing_imports = true
